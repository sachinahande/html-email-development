<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">

  <title>Responsive HTML Email Footer</title>
</head>

<body style="margin:0;padding:0;background-color:#111111;">

  <!--
    Responsive HTML Email Footer
    Author: Sachin Hande
    Portfolio: https://sachinhande.work/
  -->

  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="width:100%;background-color:#111111;"
  >
    <tr>
      <td align="center" style="padding:32px 20px;">

        <table
          role="presentation"
          width="600"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="width:100%;max-width:600px;"
        >

          <!-- Brand -->
          <tr>
            <td
              align="center"
              style="
                padding-bottom:18px;
                font-family:Arial,Helvetica,sans-serif;
                font-size:22px;
                line-height:28px;
                font-weight:bold;
                color:#ffffff;
              "
            >
              Sachin Hande
            </td>
          </tr>

          <!-- Navigation -->
          <tr>
            <td
              align="center"
              style="
                padding-bottom:20px;
                font-family:Arial,Helvetica,sans-serif;
                font-size:14px;
                line-height:22px;
              "
            >

              <a
                href="https://sachinhande.work/"
                target="_blank"
                aria-label="Visit Sachin Hande portfolio"
                style="
                  color:#ffffff;
                  text-decoration:none;
                  margin:0 8px;
                "
              >
                Portfolio
              </a>

              <span style="color:#666666;">|</span>

              <a
                href="https://sachinhande.work/blog.html"
                target="_blank"
                aria-label="Read Sachin Hande blog"
                style="
                  color:#ffffff;
                  text-decoration:none;
                  margin:0 8px;
                "
              >
                Blog
              </a>

              <span style="color:#666666;">|</span>

              <a
                href="https://sachinhande.work/templates_tools.html"
                target="_blank"
                aria-label="View email templates and tools"
                style="
                  color:#ffffff;
                  text-decoration:none;
                  margin:0 8px;
                "
              >
                Tools
              </a>

              <span style="color:#666666;">|</span>

              <a
                href="https://sachinhande.work/#contact"
                target="_blank"
                aria-label="Contact Sachin Hande"
                style="
                  color:#ffffff;
                  text-decoration:none;
                  margin:0 8px;
                "
              >
                Contact
              </a>

            </td>
          </tr>

          <!-- Social Links -->
          <tr>
            <td
              align="center"
              style="
                padding-bottom:22px;
                font-family:Arial,Helvetica,sans-serif;
                font-size:14px;
                line-height:22px;
              "
            >

              <a
                href="https://www.linkedin.com/in/sachin-h-5a64647/"
                target="_blank"
                aria-label="Visit Sachin Hande LinkedIn profile"
                style="
                  color:#ffffff;
                  text-decoration:none;
                  margin:0 8px;
                "
              >
                LinkedIn
              </a>

              <span style="color:#666666;">|</span>

              <a
                href="https://github.com/sachinahande"
                target="_blank"
                aria-label="Visit Sachin Hande GitHub profile"
                style="
                  color:#ffffff;
                  text-decoration:none;
                  margin:0 8px;
                "
              >
                GitHub
              </a>

            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td
              style="
                border-top:1px solid #333333;
                font-size:0;
                line-height:0;
              "
            >
              &nbsp;
            </td>
          </tr>

          <!-- Copyright -->
          <tr>
            <td
              align="center"
              style="
                padding-top:18px;
                font-family:Arial,Helvetica,sans-serif;
                font-size:12px;
                line-height:18px;
                color:#999999;
              "
            >
              © 2026 Sachin Hande. All rights reserved.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
