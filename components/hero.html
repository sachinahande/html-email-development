<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">

  <title>Responsive Email Hero Component</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      background-color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }

    table {
      border-spacing: 0;
      border-collapse: collapse;
    }

    img {
      display: block;
      border: 0;
      max-width: 100%;
      height: auto;
    }

    .container {
      width: 600px;
      max-width: 600px;
    }

    .hero-column {
      width: 50%;
      vertical-align: middle;
    }

    .hero-content {
      padding: 40px;
    }

    .hero-title {
      margin: 0 0 14px;
      color: #111111;
      font-size: 30px;
      line-height: 38px;
    }

    .hero-copy {
      margin: 0 0 24px;
      color: #444444;
      font-size: 16px;
      line-height: 26px;
    }

    .hero-button {
      display: inline-block;
      padding: 14px 26px;
      background-color: #111111;
      color: #ffffff !important;
      font-size: 16px;
      line-height: 20px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
    }

    @media screen and (max-width: 620px) {

      .container {
        width: 100% !important;
        max-width: 100% !important;
      }

      .hero-column {
        display: block !important;
        width: 100% !important;
      }

      .hero-content {
        padding: 30px 20px !important;
      }

      .hero-title {
        font-size: 26px !important;
        line-height: 34px !important;
      }

      .hero-copy {
        font-size: 15px !important;
        line-height: 24px !important;
      }

      .hero-button {
        display: block !important;
        text-align: center !important;
      }

      .hero-image {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
      }

    }
  </style>
</head>

<body>

  <!-- Preheader -->
  <div
    style="
      display:none;
      max-height:0;
      overflow:hidden;
      opacity:0;
      color:transparent;
      height:0;
      width:0;
      mso-hide:all;
    "
  >
    Responsive HTML email hero component example.
  </div>

  <table
    role="presentation"
    width="100%"
    border="0"
    cellspacing="0"
    cellpadding="0"
    bgcolor="#f4f4f4"
  >
    <tr>
      <td align="center">

        <!-- Main container -->
        <table
          role="presentation"
          class="container"
          width="600"
          border="0"
          cellspacing="0"
          cellpadding="0"
          style="
            width:600px;
            max-width:600px;
            background-color:#ffffff;
          "
        >

          <tr>

            <!-- Hero Content -->
            <td
              class="hero-column"
              width="50%"
              valign="middle"
              style="
                width:50%;
                vertical-align:middle;
                background-color:#ffffff;
              "
            >
              <table
                role="presentation"
                width="100%"
                border="0"
                cellspacing="0"
                cellpadding="0"
              >
                <tr>
                  <td class="hero-content">

                    <p
                      style="
                        margin:0 0 10px;
                        color:#666666;
                        font-size:13px;
                        line-height:20px;
                        font-weight:bold;
                        text-transform:uppercase;
                        letter-spacing:1px;
                      "
                    >
                      HTML Email Component
                    </p>

                    <h1 class="hero-title">
                      Build Better Email Experiences
                    </h1>

                    <p class="hero-copy">
                      A responsive hero component designed for
                      modern HTML email development and
                      cross-client compatibility.
                    </p>

                    <!-- CTA -->
                    <a
                      href="https://sachinhande.work/"
                      target="_blank"
                      class="hero-button"
                      aria-label="Visit Sachin Hande portfolio"
                    >
                      Visit Portfolio
                    </a>

                  </td>
                </tr>
              </table>
            </td>

            <!-- Hero Image -->
            <td
              class="hero-column"
              width="50%"
              valign="middle"
              style="
                width:50%;
                vertical-align:middle;
                background-color:#111111;
              "
            >
              <img
                class="hero-image"
                src="https://placehold.co/600x500/111111/ffffff?text=HTML+EMAIL"
                width="300"
                alt="HTML email development example"
                style="
                  display:block;
                  width:100%;
                  max-width:300px;
                  height:auto;
                  border:0;
                  outline:none;
                  text-decoration:none;
                "
              >
            </td>

          </tr>

        </table>
        <!-- End Main container -->

      </td>
    </tr>
  </table>

</body>
</html>
