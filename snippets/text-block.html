<!--
  Responsive Email Text Block
  Author: Sachin Hande
  Portfolio: https://sachinhande.work/

  Purpose:
  Reusable email-safe text and content block for HTML emails.
-->

<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width:100%;"
>
  <tr>
    <td
      align="left"
      style="
        padding:24px;
        font-family:Arial, Helvetica, sans-serif;
        color:#222222;
      "
    >

      <!-- Heading -->
      <h2
        style="
          margin:0 0 12px;
          padding:0;
          font-family:Arial, Helvetica, sans-serif;
          font-size:24px;
          line-height:32px;
          font-weight:bold;
          color:#111111;
        "
      >
        Email Content Heading
      </h2>

      <!-- Paragraph -->
      <p
        style="
          margin:0;
          padding:0;
          font-family:Arial, Helvetica, sans-serif;
          font-size:16px;
          line-height:24px;
          color:#444444;
        "
      >
        This is a reusable email text block. Replace this content
        with your campaign message, product information, announcement,
        or other email content.
      </p>

    </td>
  </tr>
</table>
