<!--
  Email Divider
  Author: Sachin Hande
  Portfolio: https://sachinhande.work/

  Purpose:
  Reusable email-safe horizontal divider for HTML emails.
-->

<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width:100%;"
>
  <tr>
    <td
      style="
        padding:24px 0;
        font-size:0;
        line-height:0;
      "
    >
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="width:100%;"
      >
        <tr>
          <td
            style="
              height:1px;
              background-color:#dddddd;
              font-size:1px;
              line-height:1px;
            "
          >
            &nbsp;
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
