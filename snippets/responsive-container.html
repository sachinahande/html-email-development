<!-- Email Container -->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width:100%; margin:0; padding:0;"
>
  <tr>
    <td
      align="center"
      style="padding:0 20px;"
    >

      <!--[if mso]>
      <table
        role="presentation"
        width="600"
        cellpadding="0"
        cellspacing="0"
        border="0"
        align="center"
      >
        <tr>
          <td>
      <![endif]-->

      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="
          width:100%;
          max-width:600px;
          margin:0 auto;
        "
      >
        <tr>
          <td
            style="
              padding:32px 24px;
              font-family:Arial, Helvetica, sans-serif;
              font-size:16px;
              line-height:24px;
              color:#222222;
            "
          >

            <!-- Content goes here -->

            <h1
              style="
                margin:0 0 16px;
                font-family:Arial, Helvetica, sans-serif;
                font-size:28px;
                line-height:36px;
                font-weight:bold;
                color:#111111;
              "
            >
              Email Content
            </h1>

            <p
              style="
                margin:0;
                font-family:Arial, Helvetica, sans-serif;
                font-size:16px;
                line-height:24px;
                color:#444444;
              "
            >
              Replace this content with your email content.
              This container is designed to provide a reliable
              responsive structure for HTML email development.
            </p>

          </td>
        </tr>
      </table>

      <!--[if mso]>
          </td>
        </tr>
      </table>
      <![endif]-->

    </td>
  </tr>
</table>
