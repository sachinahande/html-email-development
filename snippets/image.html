<!--
  Responsive Email Image
  Author: Sachin Hande
  Portfolio: https://sachinhande.work/

  Purpose:
  Reusable responsive image snippet for HTML emails.
-->

<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width:100%;"
>
  <tr>
    <td
      align="center"
      style="padding:0;"
    >

      <img
        src="https://placehold.co/600x300/111111/ffffff?text=Email+Image"
        width="600"
        alt="Responsive HTML email banner example"
        style="
          display:block;
          width:100%;
          max-width:600px;
          height:auto;
          margin:0 auto;
          border:0;
          outline:none;
          text-decoration:none;
          -ms-interpolation-mode:bicubic;
        "
      >

    </td>
  </tr>
</table>
