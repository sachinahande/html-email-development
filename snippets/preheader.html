<!--
  Email Preheader
  Author: Sachin Hande
  Portfolio: https://sachinhande.work/

  Purpose:
  Reusable hidden preheader text for HTML emails.
-->

<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width:100%;"
>
  <tr>
    <td
      style="
        display:none !important;
        visibility:hidden;
        mso-hide:all;
        font-size:1px;
        line-height:1px;
        max-height:0;
        max-width:0;
        opacity:0;
        overflow:hidden;
        color:transparent;
      "
    >
      Preview text for your email campaign goes here.
      &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
      &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
      &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
    </td>
  </tr>
</table>
